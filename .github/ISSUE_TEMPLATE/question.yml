name: ❓ Question
description: Ask a question about usage or configuration.
labels:
  - question
body:
  - type: markdown
    attributes:
      value:
        "This form creates a public VaryAI issue. Do not report security vulnerabilities here. See SECURITY.md
        at the repository root for the status of private reporting channels.

        Remove API keys, tokens, passwords, personal or customer data, and private URLs from logs, screenshots, and
        configuration samples before posting."
  - type: checkboxes
    attributes:
      label: Self Checks
      options:
        - label: I have read this VaryAI repository's README and relevant documentation.
          required: true
        - label: I have searched this repository's issues, including closed ones.
          required: true
  - type: dropdown
    attributes:
      label: Related App
      description: Which app is your question about?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - OpenCode
        - OpenClaw
        - General
    validations:
      required: true
  - type: textarea
    attributes:
      label: Your Question
      description: Describe your question clearly.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What Have You Tried
      description: Describe what you've already tried or researched.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Environment
      description: OS, VaryAI version, and relevant details. For source builds, include the commit SHA.
      placeholder: e.g. macOS 15.4, VaryAI 0.2.3
    validations:
      required: false
