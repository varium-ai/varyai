name: 🐛 Bug Report
description: Report errors or unexpected behavior.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value:
        "This form creates a public VaryAI issue. Do not report security vulnerabilities here. See SECURITY.md
        at the repository root for the status of private reporting channels.

        Remove API keys, tokens, passwords, personal or customer data, and private URLs from logs, screenshots, and
        configuration samples before posting."
  - type: checkboxes
    attributes:
      label: Self Checks
      options:
        - label: I have read this VaryAI repository's README and relevant documentation.
          required: true
        - label: I have searched this repository's issues, including closed ones.
          required: true
  - type: input
    attributes:
      label: VaryAI Version
      description: See the Settings page in the app.
      placeholder: e.g. 0.2.3; for source builds, include the commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating System
      multiple: false
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Related App
      description: Which app is affected?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - OpenCode
        - OpenClaw
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Describe the steps to reproduce the bug. Use synthetic inputs and sanitized screenshots or logs.
      placeholder: "1. Go to ...

        2. Click on ...

        3. See error ..."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
      description:
        Add only sanitized context, screenshots, or logs. Do not attach real credentials or private configuration
        files.
    validations:
      required: false
