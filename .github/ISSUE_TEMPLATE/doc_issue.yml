name: 📖 Documentation Issue
description: Report documentation errors, outdated content, or missing information.
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value:
        "This form creates a public VaryAI issue. Do not report security vulnerabilities here. See SECURITY.md
        at the repository root for the status of private reporting channels.

        Remove API keys, tokens, passwords, personal or customer data, and private URLs from excerpts and screenshots
        before posting."
  - type: checkboxes
    attributes:
      label: Self Checks
      options:
        - label: I have searched this repository's issues, including closed ones.
          required: true
  - type: dropdown
    attributes:
      label: Language
      description: Which language version of the docs?
      multiple: true
      options:
        - English
        - ""
        - ""
    validations:
      required: true
  - type: input
    attributes:
      label: Document Location
      description: Which file or section is affected? Provide a link or file path.
      placeholder: e.g. README.md#develop-from-source or docs/guides/provider-routing.md
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Issue Type
      options:
        - Typo or grammar
        - Outdated content
        - Missing information
        - Translation issue
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: Describe the documentation issue.
    validations:
      required: true
