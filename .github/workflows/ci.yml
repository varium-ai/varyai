name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      wsl: ${{ steps.filter.outputs.wsl }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push or manual runs it needs local git history to diff against.
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "src-tauri/resources/trae-bridge/**"
              - "scripts/**"
              - "package-macos.sh"
              - ".node-version"
              - "tests/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"
            # Exercise WSL filesystem compatibility for storage/configuration changes.
            # Unrelated backend changes still run the three-platform backend suite.
            wsl:
              - "src-tauri/src/config.rs"
              - "src-tauri/src/settings.rs"
              - "src-tauri/src/*_config.rs"
              - "src-tauri/src/pi_config/**"
              - "src-tauri/src/claude_mcp.rs"
              - "src-tauri/src/prompt_files.rs"
              - "src-tauri/src/database/**"
              - "src-tauri/src/services/config.rs"
              - "src-tauri/src/services/profile*.rs"
              - "src-tauri/src/services/profile_bundle/**"
              - "src-tauri/src/services/*_files.rs"
              - "src-tauri/src/services/webdav*.rs"
              - "src-tauri/src/services/webdav_sync/**"
              - "src-tauri/tests/**"
              - "src-tauri/Cargo.toml"
              - "src-tauri/Cargo.lock"
              - "src-tauri/build.rs"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/wsl2-manual.yml"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    # Main pushes and manual runs always validate the renderer and warm its cache.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        # Read the exact packageManager version without Node's bundled Corepack.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Build renderer
        run: pnpm build:renderer

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Unit tests
        run: pnpm test:unit

      - name: Client bridge tests
        run: pnpm test:trae-bridge

      - name: Qoder codec tests
        run: pnpm test:qoder-codec

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --no-fail-fast --manifest-path src-tauri/Cargo.toml

  backend-windows-wsl2:
    name: Backend Checks (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 45
    needs: changes
    # Manual CI runs exercise this contract regardless of changed paths.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.wsl == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        # Record the built test binary path so the run step below can execute
        # it directly instead of re-invoking cargo with TEMP on \\wsl.localhost.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $testBinary = cargo test --lib --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '"reason":"compiler-artifact"') {
                $artifact = $_ | ConvertFrom-Json
                if ($artifact.executable -and $artifact.profile.test -and $artifact.target.name -eq 'cc_switch_lib') {
                  $artifact.executable
                }
              }
            } | Select-Object -First 1 -Wait
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not $testBinary) {
            throw "cc_switch_lib test binary not found in cargo compiler artifacts"
          }
          "CC_SWITCH_TEST_EXE=$testBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          # Keep the distro alive while Windows accesses its UNC filesystem.
          $keepAlive = Start-Process -FilePath wsl.exe -ArgumentList @('-d', 'Ubuntu-24.04', '--', 'sleep', 'infinity') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/wsl-keepalive.log" -RedirectStandardError "$env:RUNNER_TEMP/wsl-keepalive-error.log"
          "CC_SWITCH_WSL_KEEPALIVE_PID=$($keepAlive.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to prepare the WSL2 test directories"
          }
          if ($keepAlive.HasExited) {
            throw "WSL2 keepalive exited before the filesystem tests"
          }
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        # Run the test binary built in the previous step directly. Invoking cargo
        # here with TEMP pointing at a WSL UNC path can re-link the crate, and
        # link.exe/mt.exe cannot create manifest temp files on \\wsl.localhost.
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $env:CC_SWITCH_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $env:CC_SWITCH_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Stop WSL2 keepalive
        if: always()
        shell: pwsh
        run: |
          if ($env:CC_SWITCH_WSL_KEEPALIVE_PID) {
            Stop-Process -Id ([int]$env:CC_SWITCH_WSL_KEEPALIVE_PID) -ErrorAction SilentlyContinue
          }

  required:
    name: CI Required
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend, backend-windows-wsl2]
    if: always()
    steps:
      - name: Verify all required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          WSL_CHANGED: ${{ needs.changes.outputs.wsl }}
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WSL_RESULT: ${{ needs.backend-windows-wsl2.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]] || {
            echo "Changed-area detection did not succeed: $CHANGES_RESULT"
            exit 1
          }
          for changed in "$FRONTEND_CHANGED" "$BACKEND_CHANGED" "$WSL_CHANGED"; do
            [[ "$changed" == true || "$changed" == false ]] || {
              echo "Changed-area detection returned an invalid result"
              exit 1
            }
          done
          verify_result() {
            local name="$1" changed="$2" result="$3" expected=success
            if [[ "$EVENT_NAME" == pull_request && "$changed" == false ]]; then
              expected=skipped
            fi
            if [[ "$result" != "$expected" ]]; then
              echo "$name: expected $expected, received $result"
              exit 1
            fi
          }
          verify_result frontend "$FRONTEND_CHANGED" "$FRONTEND_RESULT"
          verify_result backend "$BACKEND_CHANGED" "$BACKEND_RESULT"
          # WSL is path-filtered on both PRs and main pushes, but always runs manually.
          wsl_expected=success
          if [[ "$EVENT_NAME" != workflow_dispatch && "$WSL_CHANGED" == false ]]; then
            wsl_expected=skipped
          fi
          if [[ "$WSL_RESULT" != "$wsl_expected" ]]; then
            echo "wsl2: expected $wsl_expected, received $WSL_RESULT"
            exit 1
          fi
