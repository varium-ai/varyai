name: WSL2 Full Suite (Manual)

# The full backend suite takes 50+ minutes on a \\wsl.localhost 9P filesystem,
# so maintainers run it before releases or when investigating WSL compatibility.
# The path-filtered gate in ci.yml runs only the atomic-write contract test.
on:
  workflow_dispatch:

concurrency:
  group: wsl2-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-windows-wsl2-full:
    name: Backend Full Suite (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $testBinaries = @(cargo test --tests --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '"reason":"compiler-artifact"') {
                $artifact = $_ | ConvertFrom-Json
                if ($artifact.executable -and $artifact.profile.test) {
                  $artifact.executable
                }
              }
            } | Sort-Object -Unique)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($testBinaries.Count -eq 0) {
            throw "No test binaries found in cargo compiler artifacts"
          }
          $manifest = Join-Path $env:RUNNER_TEMP "wsl-test-binaries.json"
          ConvertTo-Json -InputObject $testBinaries | Set-Content -LiteralPath $manifest
          "CC_SWITCH_TEST_BINARIES=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          # Keep the distro alive while Windows accesses its UNC filesystem.
          $keepAlive = Start-Process -FilePath wsl.exe -ArgumentList @('-d', 'Ubuntu-24.04', '--', 'sleep', 'infinity') -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/wsl-keepalive.log" -RedirectStandardError "$env:RUNNER_TEMP/wsl-keepalive-error.log"
          "CC_SWITCH_WSL_KEEPALIVE_PID=$($keepAlive.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to prepare the WSL2 test directories"
          }
          if ($keepAlive.HasExited) {
            throw "WSL2 keepalive exited before the filesystem tests"
          }
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $expected = "${testName}: test"
          $contractBinary = $null
          $testBinaries = Get-Content -Raw -LiteralPath $env:CC_SWITCH_TEST_BINARIES | ConvertFrom-Json
          foreach ($binary in $testBinaries) {
            $testList = & $binary --list --ignored
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            if ($testList -contains $expected) {
              $contractBinary = $binary
              break
            }
          }
          if (-not $contractBinary) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $contractBinary $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run full test suite against WSL2-backed home
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testBinaries = Get-Content -Raw -LiteralPath $env:CC_SWITCH_TEST_BINARIES | ConvertFrom-Json
          foreach ($binary in $testBinaries) {
            & $binary --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Stop WSL2 keepalive
        if: always()
        shell: pwsh
        run: |
          if ($env:CC_SWITCH_WSL_KEEPALIVE_PID) {
            Stop-Process -Id ([int]$env:CC_SWITCH_WSL_KEEPALIVE_PID) -ErrorAction SilentlyContinue
          }
