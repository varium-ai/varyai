version: 2
# Scheduled version updates are deliberately limited. Security updates use a
# separate GitHub setting and PR limit; these groups apply only to version updates.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-deps:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
