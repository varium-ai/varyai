<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4efe4" />
    <title>Panda on a Bike</title>
    <style>
      :root {
        --ink: #171918;
        --paper: #f4efe4;
        --paper-deep: #e9dfcf;
        --leaf: #657b61;
        --leaf-dark: #334b3b;
        --terracotta: #bd674c;
        --sun: #edc66b;
        --sky: #cfe1de;
        --road: #d8c6ad;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }

      .stage {
        position: relative;
        width: min(100vw, 1440px);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        isolation: isolate;
        background: var(--paper);
      }

      .stage::before,
      .stage::after {
        position: absolute;
        z-index: 10;
        pointer-events: none;
        content: '';
      }

      .stage::before {
        inset: 0;
        opacity: 0.17;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }

      .stage::after {
        inset: 3.8%;
        border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent);
        border-radius: 2px;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .sky-glow {
        fill: var(--sky);
        opacity: 0.72;
      }

      .sun {
        transform-box: fill-box;
        transform-origin: center;
        animation: sun-pulse 5s ease-in-out infinite;
      }

      .sun-core {
        fill: var(--sun);
        stroke: var(--ink);
        stroke-width: 5;
      }

      .sun-ray {
        fill: none;
        stroke: var(--terracotta);
        stroke-linecap: round;
        stroke-width: 5;
      }

      .cloud {
        opacity: 0.8;
      }

      .cloud-shape {
        fill: #faf7ef;
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 4;
      }

      .back-hills {
        fill: #9eb5a0;
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 5;
      }

      .back-hills-shade {
        fill: #aec2aa;
      }

      .front-hills {
        fill: var(--leaf);
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 5;
      }

      .hill-path {
        animation: hill-sway 9s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      .tree-trunk {
        fill: #6a523e;
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 4;
      }

      .tree-crown {
        fill: var(--leaf-dark);
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 4;
      }

      .tree-leaf {
        fill: #7f9a75;
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 3;
      }

      .ground {
        fill: var(--road);
        stroke: var(--ink);
        stroke-width: 5;
      }

      .road-markers {
        animation: road-slide 2.4s linear infinite;
      }

      .road-marker {
        fill: var(--paper);
        opacity: 0.88;
      }

      .bike-frame {
        fill: none;
        stroke: var(--terracotta);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 7;
      }

      .bike-frame-dark {
        fill: none;
        stroke: var(--ink);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 5;
      }

      .wheel {
        fill: none;
        stroke: var(--ink);
        stroke-width: 6;
      }

      .wheel-inner {
        fill: none;
        stroke: var(--terracotta);
        stroke-dasharray: 2 13;
        stroke-linecap: round;
        stroke-width: 3;
      }

      .wheel-spin {
        animation: wheel-spin 1.1s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .panda-fur {
        fill: #f8f5ec;
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 5;
      }

      .panda-black {
        fill: var(--ink);
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 4;
      }

      .panda-cheek {
        fill: #eeb4a0;
        opacity: 0.8;
      }

      .panda-eye {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 3;
      }

      .panda-eye-dot {
        fill: var(--ink);
      }

      .panda-mouth {
        fill: none;
        stroke: var(--ink);
        stroke-linecap: round;
        stroke-width: 3;
      }

      .scarf {
        fill: var(--terracotta);
        stroke: var(--ink);
        stroke-linejoin: round;
        stroke-width: 4;
      }

      .ear {
        animation: ear-bounce 1.5s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      .panda-body {
        animation: body-bob 0.86s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      .leg {
        animation: pedal 0.86s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 16%;
      }

      .leg.back {
        animation-delay: -0.43s;
      }

      .arm {
        animation: handlebar-rock 0.86s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 84% 18%;
      }

      .tail {
        animation: tail-wag 1.7s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 90% 50%;
      }

      .floating-leaf {
        animation: float-leaf 4.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .floating-leaf.two {
        animation-delay: -2.1s;
      }

      .caption {
        fill: var(--ink);
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      @keyframes ride-across {
        0% {
          transform: translateX(-33%);
        }
        10% {
          transform: translateX(-25%);
        }
        46%,
        58% {
          transform: translateX(0);
        }
        90% {
          transform: translateX(25%);
        }
        100% {
          transform: translateX(33%);
        }
      }

      @keyframes wheel-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pedal {
        0%,
        100% {
          transform: rotate(-18deg);
        }
        50% {
          transform: rotate(26deg);
        }
      }

      @keyframes body-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      @keyframes handlebar-rock {
        0%,
        100% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(4deg);
        }
      }

      @keyframes tail-wag {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(13deg);
        }
      }

      @keyframes ear-bounce {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-7deg);
        }
      }

      @keyframes road-slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-220px);
        }
      }

      @keyframes drift {
        from {
          transform: translateX(-35px);
        }
        to {
          transform: translateX(90px);
        }
      }

      @keyframes drift-reverse {
        from {
          transform: translateX(30px);
        }
        to {
          transform: translateX(-80px);
        }
      }

      @keyframes hill-sway {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(-10px);
        }
      }

      @keyframes sun-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      @keyframes float-leaf {
        0%,
        100% {
          transform: translate(0, 0) rotate(-8deg);
          opacity: 0.6;
        }
        50% {
          transform: translate(18px, -22px) rotate(24deg);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
